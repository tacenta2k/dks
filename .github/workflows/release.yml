name: Release DKS

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      dry_run:
        description: Dry run — same sequence as a release, but package with --publish never (no tag push, no release, no publish)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-dks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Error "Release DKS must be run from the main branch (current ref: $env:GITHUB_REF)."
            exit 1
          }

          git switch main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure node-gyp toolchain
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SELECTED_PYTHON) -or -not (Test-Path -LiteralPath $env:SELECTED_PYTHON)) {
            Write-Error "actions/setup-python did not provide an existing python-path output."
            exit 1
          }

          "npm_config_python=$env:SELECTED_PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show native build toolchain
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $nodeVersion = (node --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pathPythonVersion = (python --version 2>&1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selectedPythonVersion = (& $env:SELECTED_PYTHON --version 2>&1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($nodeVersion -ne 'v20.19.0') {
            Write-Error "Expected project Node v20.19.0 from .nvmrc, got $nodeVersion."
            exit 1
          }
          if ($selectedPythonVersion -notmatch '^Python 3\.11\.') {
            Write-Error "Expected Python 3.11 for node-gyp, got $selectedPythonVersion."
            exit 1
          }
          if ($env:npm_config_python -ne $env:SELECTED_PYTHON) {
            Write-Error "npm_config_python does not match the Python selected by actions/setup-python."
            exit 1
          }
          if ($env:npm_config_msvs_version -ne '2022') {
            Write-Error "npm_config_msvs_version must be 2022 for this release runner."
            exit 1
          }

          $programFilesX86 = [System.Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if ([string]::IsNullOrWhiteSpace($programFilesX86) -or -not (Test-Path -LiteralPath $vswhere)) {
            Write-Error "Visual Studio Installer tool was not found at $vswhere."
            exit 1
          }

          $vsInstallPath = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clPath = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ([string]::IsNullOrWhiteSpace($vsInstallPath) -or [string]::IsNullOrWhiteSpace($clPath) -or -not (Test-Path -LiteralPath $clPath)) {
            Write-Error "Visual Studio 2022 C++ x64 toolchain was not found on this runner."
            exit 1
          }

          Write-Host "Node: $nodeVersion"
          Write-Host "npm: $npmVersion"
          Write-Host "Python on PATH: $pathPythonVersion"
          Write-Host "Selected Python: $selectedPythonVersion"
          Write-Host "Selected Python path: $env:SELECTED_PYTHON"
          Write-Host "npm_config_python: $env:npm_config_python"
          Write-Host "npm_config_msvs_version: $env:npm_config_msvs_version"
          Write-Host "Visual Studio 2022: $vsInstallPath"
          Write-Host "Visual Studio 2022 C++ compiler: $clPath"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node -e "require('better-sqlite3')"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "better-sqlite3 is not loadable by Node after npm ci; rebuilding it for Node before tests."
            npm rebuild better-sqlite3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            node -e "require('better-sqlite3')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --testTimeout=60000

      - name: Resolve version and tag
        id: version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ("${{ inputs.bump }}" -eq "none") {
            $version = (node -p "require('./package.json').version").Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
              Write-Error "Could not read version from package.json."
              exit 1
            }
            $tag = "v$version"
            $dryRun = "${{ inputs.dry_run }}" -eq "true"
            $existing = git tag -l $tag
            if ($existing) {
              # v0.1.6 and v0.1.11 were tagged but produced no GitHub release
              # (packaging failed before upload). Re-running this workflow for
              # such a version must build and publish the SAME version: the tag
              # is an existing published ref and is never recreated or moved.
              #
              # The build must contain the TAGGED commit, not merely descend
              # from it: `bump=none` republishes an already-versioned release,
              # so building a later main would ship code that the tag does not
              # describe while latest.yml still says $version. Being an
              # ancestor is therefore not enough — HEAD must BE the tag commit.
              $tagCommit = (git rev-list -n 1 $tag).Trim()
              $head = (git rev-parse HEAD).Trim()
              if ($tagCommit -ne $head) {
                Write-Error "bump=none reuses tag $tag, which points at $tagCommit, but this run checked out $head. A release must build the tagged commit; packaging a newer commit under the old version would publish code the tag does not describe. Either dispatch this workflow from the tag commit (or restore main to it), or bump the version for a new release."
                exit 1
              }
              Write-Host "Tag $tag already exists at $tagCommit and main is at the same commit — reusing it as-is (not recreated, not moved)."
              Write-Host "RELEASE_COMMIT=$tagCommit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "TAG_ACTION=reuse" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } elseif ($dryRun) {
              # A dry run changes nothing: report what a real dispatch would do.
              Write-Host "DRY RUN: tag $tag does not exist; a real dispatch would create it at $head."
              "TAG_ACTION=dry-run-would-create" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } else {
              git tag -a $tag -m "chore(release): $tag"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Write-Host "Created tag $tag for the existing version $version."
              "TAG_ACTION=create" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
            Write-Host "Publishing existing version $version with bump=none (tag $tag)."
          } else {
            npm version ${{ inputs.bump }} -m "chore(release): v%s"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = (node -p "require('./package.json').version").Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
              Write-Error "Could not read the bumped version from package.json."
              exit 1
            }
            $tag = "v$version"
          }

          $installer = "DKS-$version-win-x64.exe"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version $version and tag $tag."

      - name: Confirm release state for the tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Publishing must never overwrite an already-published release, and a
          # transient API problem must never be mistaken for "no release yet".
          # 404 is the only answer that means "nothing exists"; everything else
          # is reported and the release stops.
          $output = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $release = $output | ConvertFrom-Json
            if (-not $release.draft) {
              $assets = ($release.assets | ForEach-Object { $_.name }) -join ', '
              Write-Error "Release $env:RELEASE_TAG already exists and is PUBLISHED (assets: $assets). Publishing again would replace that release's installer. Nothing was built or published."
              exit 1
            }
            Write-Host "Draft release $env:RELEASE_TAG already exists (id $($release.id), assets: $($release.assets.Count)) — this run will complete it."
          } elseif ($output -match 'HTTP 404') {
            Write-Host "No release exists for $env:RELEASE_TAG — this run will create the draft release (a dry run publishes nothing)."
          } else {
            Write-Error "Could not confirm the release state for $env:RELEASE_TAG (gh exit $code): $($output.Trim()). Refusing to continue without knowing whether a release already exists."
            exit 1
          }

      - name: Write Vite build environment
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            $missing += "VITE_SUPABASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            $missing += "VITE_SUPABASE_PUBLISHABLE_KEY"
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required repository secret(s): $($missing -join ', '). Add them under Settings > Secrets and variables > Actions."
            exit 1
          }

          $envPath = Join-Path $env:GITHUB_WORKSPACE ".env"
          $lines = @(
            "VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL"
            "VITE_SUPABASE_PUBLISHABLE_KEY=$env:VITE_SUPABASE_PUBLISHABLE_KEY"
          )
          [System.IO.File]::WriteAllLines(
            $envPath,
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Push version commit and tag
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          # bump=none reuses an existing tag: nothing new to push, and an
          # existing tag is never force-pushed or moved.
          git push origin main --follow-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer and upload draft release
        shell: pwsh
        env:
          RELEASE_LOG: ${{ github.workspace }}\release-build.log
        run: |
          # Tee the output to a file so a failure is diagnosable: the job log
          # is not always retrievable, and the rcedit/packaging error used to
          # be visible only there.
          #
          # A dry run performs the SAME sequence as `npm run release`
          # (build -> verify:native -> electron-builder) with only the publish
          # flag changed to `never`, so it exercises the release path without
          # creating a draft release or uploading anything.
          if ("${{ inputs.dry_run }}" -eq "true") {
            Write-Host "DRY RUN: npm run build; npm run verify:native; electron-builder --publish never"
            cmd.exe /d /c "npm run build 1>%RELEASE_LOG% 2>&1"
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              cmd.exe /d /c "npm run verify:native 1>>%RELEASE_LOG% 2>&1"
              $code = $LASTEXITCODE
            }
            if ($code -eq 0) {
              cmd.exe /d /c "npx electron-builder --config electron-builder.yml --publish never 1>>%RELEASE_LOG% 2>&1"
              $code = $LASTEXITCODE
            }
          } else {
            cmd.exe /d /c "npm run release 1>%RELEASE_LOG% 2>&1"
            $code = $LASTEXITCODE
          }
          "PACKAGING_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($code -ne 0) {
            # Name the holder while the packaging output is still on disk: the
            # rcedit message ("Unable to commit changes") never says who held it.
            node scripts/diagnostics/holder-lookup.cjs release/win-unpacked/DKS.exe
            Write-Host "npm run release failed with exit code $code — last 120 lines:"
            if (Test-Path $env:RELEASE_LOG) {
              Get-Content -LiteralPath $env:RELEASE_LOG -Tail 120 | ForEach-Object { Write-Host "RELEASE: $_" }
              Select-String -Path $env:RELEASE_LOG -Pattern "Fatal error|Unable to commit|rcedit|⨯" |
                Select-Object -Last 20 |
                ForEach-Object { Write-Host "::error::release build: $($_.Line.Trim())" }
            } else {
              Write-Host "::error::no build log was captured at $env:RELEASE_LOG"
            }
            exit $code
          }
          if (Test-Path $env:RELEASE_LOG) {
            Select-String -Path $env:RELEASE_LOG -Pattern "rcedit|afterPack|dks\]|packaging" |
              Select-Object -Last 40 |
              ForEach-Object { Write-Host "RELEASE: $($_.Line)" }
          }

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: ${{ github.workspace }}/release-build.log
          if-no-files-found: warn

      # The job log and artifact downloads are not reliably retrievable from an
      # API-only client, so the parts that answer "did rcedit pass?" are posted
      # as a commit comment and as annotations (annotations are always readable).
      - name: Post release build evidence
        if: always()
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $mode = if ("${{ inputs.dry_run }}" -eq "true") { "dry run (--publish never)" } else { "publish" }
          $body = @(
            "## release build evidence"
            ""
            "- mode: $mode"
            "- tag: $env:RELEASE_TAG (action: $env:TAG_ACTION)"
            "- version: $env:RELEASE_VERSION"
            "- packaging exit code: $env:PACKAGING_EXIT"
          )
          $log = $env:RELEASE_LOG
          if (Test-Path $log) {
            $lines = Select-String -Path $log -Pattern "rcedit|Unable to commit|Unable to load|afterPack|\[dks\]|⨯" |
              Select-Object -Last 120 |
              ForEach-Object { $_.Line.Trim() }
            $body += ""
            $body += '```'
            $body += $lines
            $body += '```'
            foreach ($line in $lines) {
              if ($line -match "Unable to commit|Unable to load|⨯|exclusive access is blocked") {
                Write-Host "::error::release packaging: $line"
              } elseif ($line -match "rcedit's precondition|exclusive|writable") {
                Write-Host "::notice::release packaging: $line"
              }
            }
          } else {
            $body += ""
            $body += "no $log was captured"
            Write-Host "::error::no release build log was captured at $log"
          }
          $text = ($body -join "`n")
          if ($text.Length -gt 60000) { $text = $text.Substring(0, 60000) }
          try {
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$text" 2>&1 | Out-Null
            Write-Host "posted release build evidence comment"
          } catch {
            Write-Host "::warning::could not post the release build evidence comment: $_"
          }

      - name: Verify draft release assets
        id: verify
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_NAME: ${{ steps.version.outputs.installer }}
        run: |
          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets,url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG) {
            throw "Release tag mismatch: expected $env:RELEASE_TAG, got $($release.tagName)."
          }
          if (-not $release.isDraft) {
            throw "Release $env:RELEASE_TAG must still be a draft during asset verification."
          }
          if ($release.isPrerelease) {
            throw "Release $env:RELEASE_TAG must not be marked as a prerelease."
          }

          $expectedAssets = @(
            $env:INSTALLER_NAME
            "$($env:INSTALLER_NAME).blockmap"
            "latest.yml"
          ) | Sort-Object
          $actualAssets = @($release.assets | ForEach-Object { $_.name }) | Sort-Object

          if (($actualAssets -join ",") -ne ($expectedAssets -join ",")) {
            throw "Unexpected release assets for $env:RELEASE_TAG. Expected: $($expectedAssets -join ', '). Actual: $($actualAssets -join ', ')."
          }

          $checkDir = Join-Path $env:RUNNER_TEMP "dks-release-check"
          New-Item -ItemType Directory -Force -Path $checkDir | Out-Null
          gh release download $env:RELEASE_TAG --pattern "latest.yml" --dir $checkDir --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $latestYml = Get-Content -Raw (Join-Path $checkDir "latest.yml")
          $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
          if ($latestYml -notmatch "(?m)^version:\s*$escapedVersion\s*$") {
            throw "latest.yml for $env:RELEASE_TAG does not declare version $env:RELEASE_VERSION."
          }
          if ($latestYml -notmatch [regex]::Escape($env:INSTALLER_NAME)) {
            throw "latest.yml for $env:RELEASE_TAG does not reference $env:INSTALLER_NAME."
          }

          # Bug 2: latest.yml must come from the SAME build that produced the .exe.
          # Verify the uploaded latest.yml is byte-identical to the local
          # release/latest.yml generated by electron-builder in this run, and
          # that its sha512/size match the actual exe on disk.
          $localLatestYmlPath = Join-Path $env:GITHUB_WORKSPACE "release" "latest.yml"
          if (-not (Test-Path -LiteralPath $localLatestYmlPath)) {
            throw "Local release/latest.yml not found at $localLatestYmlPath — electron-builder did not produce it."
          }
          $localLatestYml = Get-Content -Raw $localLatestYmlPath
          if ($localLatestYml -ne $latestYml) {
            throw "latest.yml uploaded to the draft release does not match the local release/latest.yml built in this run. They must come from the same electron-builder invocation."
          }
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "release" $env:INSTALLER_NAME
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Local installer not found at $installerPath — cannot verify latest.yml integrity."
          }
          $installerSize = (Get-Item -LiteralPath $installerPath).Length
          if ($latestYml -notmatch "(?m)size:\s*$installerSize\b") {
            throw "latest.yml for $env:RELEASE_TAG does not declare the correct installer size $installerSize. The yml and exe are out of sync (different builds)."
          }
          # Compute sha512 as electron-builder does (base64-encoded).
          $sha512Hex = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA512).Hash
          $hexBytes = for ($i = 0; $i -lt $sha512Hex.Length; $i += 2) { [Convert]::ToByte($sha512Hex.Substring($i, 2), 16) }
          $sha512Base64 = [Convert]::ToBase64String($hexBytes)
          if ($latestYml -notmatch [regex]::Escape($sha512Base64)) {
            if ($latestYml -notmatch [regex]::Escape($sha512Hex)) {
              throw "latest.yml sha512 does not match the actual installer $env:INSTALLER_NAME (size $installerSize). The yml and exe are from different builds — this alone explains 'fails at 100%' during verify-or-install."
            }
          }

          Write-Host "Verified draft release $env:RELEASE_TAG and its updater assets (size $installerSize, sha512 matches, yml identical to local build)."

      - name: Publish verified release
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKS-${{ steps.version.outputs.version }}-win-x64-installer
          path: release/${{ steps.version.outputs.installer }}
          if-no-files-found: error

      - name: Write job summary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          INSTALLER_NAME: ${{ steps.version.outputs.installer }}
        run: |
          if ("${{ inputs.dry_run }}" -eq "true") {
            @(
              "# DKS release DRY RUN — nothing was published"
              ""
              "- **Version (unchanged):** $env:RELEASE_VERSION"
              "- **Tag action:** $env:TAG_ACTION"
              "- **Packaging exit code:** $env:PACKAGING_EXIT"
              "- No tag was pushed and no GitHub release was created or published."
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          @(
            "# DKS release published"
            ""
            "- **Version:** $env:RELEASE_VERSION"
            "- **Release:** $env:RELEASE_URL"
            "- **Installer:** $env:INSTALLER_NAME"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
