name: Release DKS

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-dks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Error "Release DKS must be run from the main branch (current ref: $env:GITHUB_REF)."
            exit 1
          }

          git switch main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python for node-gyp
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure node-gyp toolchain
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SELECTED_PYTHON) -or -not (Test-Path -LiteralPath $env:SELECTED_PYTHON)) {
            Write-Error "actions/setup-python did not provide an existing python-path output."
            exit 1
          }

          "npm_config_python=$env:SELECTED_PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show native build toolchain
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $nodeVersion = (node --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmVersion = (npm --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pathPythonVersion = (python --version 2>&1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selectedPythonVersion = (& $env:SELECTED_PYTHON --version 2>&1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($nodeVersion -ne 'v20.19.0') {
            Write-Error "Expected project Node v20.19.0 from .nvmrc, got $nodeVersion."
            exit 1
          }
          if ($selectedPythonVersion -notmatch '^Python 3\.11\.') {
            Write-Error "Expected Python 3.11 for node-gyp, got $selectedPythonVersion."
            exit 1
          }
          if ($env:npm_config_python -ne $env:SELECTED_PYTHON) {
            Write-Error "npm_config_python does not match the Python selected by actions/setup-python."
            exit 1
          }
          if ($env:npm_config_msvs_version -ne '2022') {
            Write-Error "npm_config_msvs_version must be 2022 for this release runner."
            exit 1
          }

          $programFilesX86 = [System.Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if ([string]::IsNullOrWhiteSpace($programFilesX86) -or -not (Test-Path -LiteralPath $vswhere)) {
            Write-Error "Visual Studio Installer tool was not found at $vswhere."
            exit 1
          }

          $vsInstallPath = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clPath = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ([string]::IsNullOrWhiteSpace($vsInstallPath) -or [string]::IsNullOrWhiteSpace($clPath) -or -not (Test-Path -LiteralPath $clPath)) {
            Write-Error "Visual Studio 2022 C++ x64 toolchain was not found on this runner."
            exit 1
          }

          Write-Host "Node: $nodeVersion"
          Write-Host "npm: $npmVersion"
          Write-Host "Python on PATH: $pathPythonVersion"
          Write-Host "Selected Python: $selectedPythonVersion"
          Write-Host "Selected Python path: $env:SELECTED_PYTHON"
          Write-Host "npm_config_python: $env:npm_config_python"
          Write-Host "npm_config_msvs_version: $env:npm_config_msvs_version"
          Write-Host "Visual Studio 2022: $vsInstallPath"
          Write-Host "Visual Studio 2022 C++ compiler: $clPath"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node -e "require('better-sqlite3')"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "better-sqlite3 is not loadable by Node after npm ci; rebuilding it for Node before tests."
            npm rebuild better-sqlite3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            node -e "require('better-sqlite3')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --testTimeout=60000

      - name: Bump version and create tag
        id: version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version ${{ inputs.bump }} -m "chore(release): v%s"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (node -p "require('./package.json').version").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not read the bumped version from package.json."
            exit 1
          }

          $tag = "v$version"
          $installer = "DKS-$version-win-x64.exe"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Created version commit and tag $tag."

      - name: Write Vite build environment
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            $missing += "VITE_SUPABASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            $missing += "VITE_SUPABASE_PUBLISHABLE_KEY"
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required repository secret(s): $($missing -join ', '). Add them under Settings > Secrets and variables > Actions."
            exit 1
          }

          $envPath = Join-Path $env:GITHUB_WORKSPACE ".env"
          $lines = @(
            "VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL"
            "VITE_SUPABASE_PUBLISHABLE_KEY=$env:VITE_SUPABASE_PUBLISHABLE_KEY"
          )
          [System.IO.File]::WriteAllLines(
            $envPath,
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Push version commit and tag
        run: git push origin main --follow-tags

      - name: Build Windows installer and upload draft release
        run: npm run release

      - name: Verify draft release assets
        id: verify
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_NAME: ${{ steps.version.outputs.installer }}
        run: |
          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets,url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG) {
            throw "Release tag mismatch: expected $env:RELEASE_TAG, got $($release.tagName)."
          }
          if (-not $release.isDraft) {
            throw "Release $env:RELEASE_TAG must still be a draft during asset verification."
          }
          if ($release.isPrerelease) {
            throw "Release $env:RELEASE_TAG must not be marked as a prerelease."
          }

          $expectedAssets = @(
            $env:INSTALLER_NAME
            "$($env:INSTALLER_NAME).blockmap"
            "latest.yml"
          ) | Sort-Object
          $actualAssets = @($release.assets | ForEach-Object { $_.name }) | Sort-Object

          if (($actualAssets -join ",") -ne ($expectedAssets -join ",")) {
            throw "Unexpected release assets for $env:RELEASE_TAG. Expected: $($expectedAssets -join ', '). Actual: $($actualAssets -join ', ')."
          }

          $checkDir = Join-Path $env:RUNNER_TEMP "dks-release-check"
          New-Item -ItemType Directory -Force -Path $checkDir | Out-Null
          gh release download $env:RELEASE_TAG --pattern "latest.yml" --dir $checkDir --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $latestYml = Get-Content -Raw (Join-Path $checkDir "latest.yml")
          $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
          if ($latestYml -notmatch "(?m)^version:\s*$escapedVersion\s*$") {
            throw "latest.yml for $env:RELEASE_TAG does not declare version $env:RELEASE_VERSION."
          }
          if ($latestYml -notmatch [regex]::Escape($env:INSTALLER_NAME)) {
            throw "latest.yml for $env:RELEASE_TAG does not reference $env:INSTALLER_NAME."
          }

          Write-Host "Verified draft release $env:RELEASE_TAG and its updater assets."

      - name: Publish verified release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKS-${{ steps.version.outputs.version }}-win-x64-installer
          path: release/${{ steps.version.outputs.installer }}
          if-no-files-found: error

      - name: Write job summary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          INSTALLER_NAME: ${{ steps.version.outputs.installer }}
        run: |
          @(
            "# DKS release published"
            ""
            "- **Version:** $env:RELEASE_VERSION"
            "- **Release:** $env:RELEASE_URL"
            "- **Installer:** $env:INSTALLER_NAME"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
