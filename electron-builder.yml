appId: com.dks.tracker
productName: DKS
artifactName: DKS-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
# DKS icon set (generated from build/logo-source.png by scripts/generate-icons.mjs).
# build/icon.ico carries 256/48/32/16 px frames for the exe, the installer and
# Add/Remove Programs; build/icon.png is the 1024px master plus the window icon.
icon: build/icon.png
files:
  - dist-electron/**
  - package.json
extraResources:
  # Kept outside the asar so BrowserWindow can load it with
  # nativeImage.createFromPath(process.resourcesPath/icon.png).
  - from: build/icon.png
    to: icon.png
asar: true
# R7: better-sqlite3 ships a native .node binary that must live outside the
# asar archive (Electron cannot dlopen a file inside an asar). Without this the
# module is not loadable from the installed app.
asarUnpack:
  - node_modules/better-sqlite3/**
# R7: production dependencies (better-sqlite3 included) are always collected by
# electron-builder independently of `files`; the `files` globs above are NOT
# what ships node_modules. What broke the packaged app was the *ABI* of the
# shipped binary (a Node-ABI `npm rebuild` left in the tree), so the dist path
# is guarded twice: scripts/verify-native-modules.mjs (before packaging) and
# afterPack (below, against the packaged app.asar.unpacked copy).
npmRebuild: true
# Not enabled on purpose: it always compiles from source (needs MSVC + headers
# even when a valid Electron prebuild exists). The verification hooks above
# rebuild for Electron and then prove the packaged binary loads.
buildDependenciesFromSource: false
# R7: dist-time proof that the packaged better_sqlite3.node loads under the
# packaged Electron binary. Throws — and aborts the installer — otherwise.
afterPack: scripts/after-pack.cjs
extraMetadata:
  main: dist-electron/main/index.js
win:
  target:
    - nsis
  icon: build/icon.ico
  executableName: DKS
  publisherName: DKS
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DKS
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
publish:
  provider: github
